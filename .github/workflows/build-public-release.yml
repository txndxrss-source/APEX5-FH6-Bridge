name: Build Public Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller hidapi

      - name: Build Bridge EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name APEX5_FH6_Bridge `
            --hidden-import=hid `
            bridge_worker.py

      - name: Build GUI EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name APEX5_FH6_GUI `
            apex5_gui.pyw

      - name: Prepare release folder
        shell: powershell
        run: |
          Remove-Item release -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path release | Out-Null
          New-Item -ItemType Directory -Path release\profiles | Out-Null

          Copy-Item dist\APEX5_FH6_Bridge.exe release\
          Copy-Item dist\APEX5_FH6_GUI.exe release\

          Copy-Item profiles\*.ini release\profiles\

          Copy-Item README.md release\
          Copy-Item VERSION.txt release\

          Write-Host "===== RELEASE CONTENTS ====="
          Get-ChildItem release -Recurse
          Write-Host "============================"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found."
          }

          & $iscc /Q installer\APEX5_FH6_Bridge_Setup.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed."
          }

          $installer = "installer\APEX5_FH6_Bridge_Setup.exe"

          if (!(Test-Path $installer)) {
            throw "Installer was not created."
          }

          Write-Host "Installer created successfully:"
          Get-Item $installer | Format-List FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: APEX5-FH6-Bridge-Windows
          if-no-files-found: error
          path: |
            release/**
            installer/APEX5_FH6_Bridge_Setup.exe

            - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"

          Write-Host "Target release: $tag"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release already exists. Uploading installer..."

            gh release upload $tag `
              "installer\APEX5_FH6_Bridge_Setup.exe" `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload installer to existing release."
            }
          }
          else {
            Write-Host "Release does not exist. Creating release..."

            gh release create $tag `
              "installer\APEX5_FH6_Bridge_Setup.exe" `
              --title "APEX 5 FH6 Bridge $tag" `
              --generate-notes `
              --latest

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub release."
            }
          }

          Write-Host "Release operation completed successfully."
